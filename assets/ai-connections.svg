<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="aiWarmBg" cx="35%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="45%" stop-color="#f5ede2"/>
      <stop offset="85%" stop-color="#ebe0d1"/>
      <stop offset="100%" stop-color="#dfd3c0"/>
    </radialGradient>

    <!-- Glowing Light Sphere on Left -->
    <radialGradient id="softOrb" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f7ecd9" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#ecdcc6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e2d0b8" stop-opacity="0"/>
    </radialGradient>

    <!-- Amber Glow Filter -->
    <filter id="bokehBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="brightSpark" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="glow1"/>
      <feGaussianBlur stdDeviation="2" result="glow2"/>
      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="glow2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Textured Bronze/Stone Bead Gradient -->
    <radialGradient id="bronzeBead" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a89279"/>
      <stop offset="35%" stop-color="#695641"/>
      <stop offset="80%" stop-color="#3d2f21"/>
      <stop offset="100%" stop-color="#1f160e"/>
    </radialGradient>

    <!-- Glowing Amber Node Gradient -->
    <radialGradient id="amberNode" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ffeaad"/>
      <stop offset="55%" stop-color="#f5af42"/>
      <stop offset="90%" stop-color="#b86b1c"/>
      <stop offset="100%" stop-color="#6e3704"/>
    </radialGradient>

    <!-- Light Bokeh Dot Gradient -->
    <radialGradient id="lightBokeh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8eb" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#ffd599" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f5ede2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#aiWarmBg)"/>

  <!-- Left Soft Defocused Sphere (as in screenshot) -->
  <circle cx="280" cy="310" r="160" fill="url(#softOrb)" filter="url(#bokehBlur)"/>
  <circle cx="270" cy="300" r="130" fill="#e9dbca" opacity="0.4" filter="url(#bokehBlur)"/>

  <!-- Background Connecting Threads (defocused / subtle) -->
  <g stroke="#d5beaa" stroke-width="1.2" opacity="0.65">
    <line x1="280" y1="310" x2="430" y2="280"/>
    <line x1="430" y1="280" x2="520" y2="190"/>
    <line x1="520" y1="190" x2="680" y2="220"/>
    <line x1="680" y1="220" x2="720" y2="340"/>
    <line x1="430" y1="280" x2="540" y2="350"/>
    <line x1="540" y1="350" x2="460" y2="460"/>
    <line x1="540" y1="350" x2="650" y2="430"/>
    <line x1="650" y1="430" x2="720" y2="340"/>
    <line x1="520" y1="190" x2="610" y2="300"/>
    <line x1="610" y1="300" x2="650" y2="430"/>
    <line x1="380" y1="420" x2="460" y2="460"/>
    <line x1="280" y1="310" x2="380" y2="420"/>
  </g>

  <!-- Foreground Crisp Network Threads -->
  <g stroke="#b89372" stroke-width="1.4" opacity="0.85">
    <!-- Connecting lines branching outward from nodes -->
    <line x1="380" y1="420" x2="540" y2="350"/>
    <line x1="540" y1="350" x2="520" y2="190"/>
    <line x1="540" y1="350" x2="610" y2="300"/>
    <line x1="540" y1="350" x2="680" y2="220"/>
    <line x1="540" y1="350" x2="580" y2="260"/>
    <line x1="580" y1="260" x2="680" y2="220"/>
    <line x1="580" y1="260" x2="650" y2="430"/>
    <line x1="540" y1="350" x2="410" y2="520"/>
    <line x1="460" y1="460" x2="520" y2="540"/>
    <line x1="650" y1="430" x2="740" y2="470"/>
    <line x1="680" y1="220" x2="760" y2="170"/>
  </g>

  <!-- Fine intricate secondary fibers -->
  <g stroke="#9e7343" stroke-width="0.8" opacity="0.6">
    <line x1="425" y1="275" x2="538" y2="346"/>
    <line x1="435" y1="285" x2="542" y2="354"/>
    <line x1="535" y1="352" x2="458" y2="455"/>
    <line x1="545" y1="348" x2="462" y2="465"/>
    <line x1="542" y1="355" x2="648" y2="428"/>
    <line x1="538" y1="345" x2="652" y2="432"/>
    <line x1="542" y1="347" x2="578" y2="258"/>
    <line x1="538" y1="353" x2="582" y2="262"/>
    <line x1="578" y1="258" x2="612" y2="298"/>
    <line x1="610" y1="302" x2="678" y2="222"/>
  </g>

  <!-- Background Soft Bokeh Dots -->
  <circle cx="590" cy="180" r="16" fill="url(#lightBokeh)"/>
  <circle cx="480" cy="220" r="14" fill="url(#lightBokeh)"/>
  <circle cx="710" cy="260" r="22" fill="url(#lightBokeh)"/>
  <circle cx="430" cy="380" r="18" fill="url(#lightBokeh)"/>
  <circle cx="630" cy="490" r="24" fill="url(#lightBokeh)"/>
  <circle cx="340" cy="480" r="20" fill="url(#lightBokeh)"/>

  <!-- Secondary Spheres (Defocused Depth) -->
  <circle cx="380" cy="420" r="8" fill="#524131" opacity="0.6" filter="url(#bokehBlur)"/>
  <circle cx="430" cy="280" r="11" fill="#755f48" opacity="0.75"/>
  <circle cx="520" cy="190" r="13" fill="#8c7054" opacity="0.8"/>
  <circle cx="720" cy="340" r="16" fill="#3a2a1a" opacity="0.85"/>
  <circle cx="410" cy="520" r="10" fill="#4d3a27" opacity="0.7"/>
  <circle cx="740" cy="470" r="18" fill="url(#bronzeBead)"/>

  <!-- Crisp Key Spheres & Beads (Matching Screenshot) -->
  <!-- Top Right Textured Dark Sphere -->
  <circle cx="680" cy="220" r="22" fill="url(#bronzeBead)"/>
  <circle cx="673" cy="212" r="18" fill="#a48c72" opacity="0.25"/>

  <!-- Mid Bronze Sphere -->
  <circle cx="460" cy="460" r="14" fill="url(#bronzeBead)"/>

  <!-- Glowing Luminous Amber Nodes (Illuminated Intersection Points) -->
  <!-- Node A (Top-mid glow) -->
  <circle cx="580" cy="260" r="9" fill="url(#amberNode)" filter="url(#brightSpark)"/>
  <circle cx="580" cy="260" r="4" fill="#ffffff"/>

  <!-- Node B (Center-Right brilliant star glow) -->
  <circle cx="610" cy="300" r="11" fill="url(#amberNode)" filter="url(#brightSpark)"/>
  <circle cx="610" cy="300" r="5" fill="#ffffff"/>

  <!-- Center Hub Bead (In Crisp Focus with Fine Threads) -->
  <circle cx="540" cy="350" r="20" fill="url(#bronzeBead)"/>
  <!-- Specular rim highlight on center bead -->
  <path d="M 524,342 A 18 18 0 0 1 546,332" stroke="#ffebc2" stroke-width="2.5" fill="none" opacity="0.7" stroke-linecap="round"/>
  
  <!-- Tiny glowing knot next to center bead -->
  <circle cx="552" cy="336" r="6" fill="url(#amberNode)" filter="url(#softGlow)"/>
  <circle cx="552" cy="336" r="2.5" fill="#ffffff"/>

  <!-- Bottom Right Bronze Sphere -->
  <circle cx="650" cy="430" r="15" fill="url(#bronzeBead)"/>
  <!-- Glowing amber partner dot -->
  <circle cx="638" cy="442" r="7" fill="url(#amberNode)" filter="url(#brightSpark)"/>
  <circle cx="638" cy="442" r="3" fill="#ffffff"/>

  <!-- Edge Soft Orbs -->
  <circle cx="520" cy="540" r="12" fill="#5c4530" opacity="0.6"/>
  <circle cx="760" cy="170" r="8" fill="#a89278" opacity="0.5"/>
</svg>
